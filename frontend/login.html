<!doctype html>
<html lang="en">
<head>
  <title>Haul — Log in</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar" id="site-header"></header>
  <main class="auth-wrap">
    <div class="panel auth-card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false">Create account</button>
      </div>

      <form id="login-form" novalidate>
        <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required></div>
        <p class="form-error hidden" id="login-error"></p>
        <button class="btn block" type="submit">Log in</button>
      </form>

      <form id="register-form" class="hidden" novalidate>
        <div class="field"><label for="reg-name">Name</label><input id="reg-name" autocomplete="name" required></div>
        <div class="field"><label for="reg-email">Email</label><input id="reg-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="reg-password">Password</label><input id="reg-password" type="password" autocomplete="new-password" minlength="6" required>
          <span class="muted small">At least 6 characters</span></div>
        <p class="form-error hidden" id="register-error"></p>
        <button class="btn block" type="submit">Create account</button>
      </form>

      <div class="demo-logins">
        Demo accounts (after running <code>seed.py</code>):<br>
        Customer: <code>customer@shop.com</code> / <code>customer123</code><br>
        Admin: <code>admin@shop.com</code> / <code>admin123</code>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
